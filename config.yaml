app:
  title: "AI Smart Surveillance Robot Dashboard"
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

network:
  robot_base_url: "http://172.28.209.179"
  camera_stream_url: "http://172.28.209.3/stream"
  request_timeout_seconds: 10.0

vision:
  black_value_threshold: 60
  black_saturation_threshold: 110
  min_black_area_px: 900
  morph_kernel_size: 5
  target_fps: 30
  frame_jpeg_quality: 40
  live_stream_enabled: true
  model_weights: "yolov8n.pt"
  model_confidence: 0.35
  model_iou_threshold: 0.25
  model_max_det: 25
  model_device: "cpu"
  object_refresh_seconds: 5
  max_lost_target_seconds: 4
  suspicious_motion_threshold_pixels: 120
  camera_retry_seconds: 3
  still_frame_refresh_seconds: 1
  dashboard_refresh_seconds: 3
  detection_hold_seconds: 3
  detection_match_iou: 0.28
  detection_center_match_px: 120
  detection_confidence_decay_per_second: 0.18
  capture_fps: 8
  tracker_fallback_enabled: true
  tracker_template_match_threshold: 0.58
  tracker_search_padding_px: 140
  tracker_max_age_seconds: 2.2
  tracker_template_min_size_px: 24

tracking:
  desired_distance_m: 1.8
  distance_reference_width_px: 180
  stop_tolerance_m: 0.2
  forward_distance_threshold_m: 2.1
  reverse_distance_threshold_m: 1.2
  center_tolerance_px: 70
  command_cooldown_seconds: 0.6
  forward_duration_seconds: 0.1
  backward_duration_seconds: 0.1
  left_duration_seconds: 5
  right_duration_seconds: 5
  forward_distance_m: 0.45
  backward_distance_m: 0.45
  left_turn_degrees: 14.0
  right_turn_degrees: 14.0
  origin_latitude: null
  origin_longitude: null
  start_heading_degrees: 0.0

alerts:
  email_enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  username: "your-email@example.com"
  password: "app-password"
  from_email: "your-email@example.com"
  to_email: "receiver@example.com"

history:
  max_commands: 200
  max_alerts: 100
  max_frames_for_debug: 5
  max_route_points: 1000
